# yaml-language-server: $schema=../schemas/profile.schema.json
# endurance-planner athlete profile.
# [required] = must be set; everything else shows its default or is optional.
# Unknown keys are rejected. Paces and times are quoted "m:ss" or "h:mm:ss".

athlete:
  name: "Victor"                # [required]
  birth_year: 1990              # optional, used for max HR estimate only (208 - 0.7 * age)
  weight_kg: 72                 # optional, enables W/kg reporting and FTP sanity check
  experience: intermediate      # beginner | intermediate | advanced (default: intermediate)
  injury_notes: ""              # free text; if non-empty, run impact multiplier is raised

thresholds:
  bike:
    ftp_w: 260                  # [required for bike sessions] unless ftp_20min_w is given
    # ftp_20min_w: 274          # best 20-min power; FTP estimated as 0.95 x (flagged as estimated)
    lthr_bpm: 168               # optional, enables HR ranges
    max_hr_bpm: 188             # optional
    ftp_test_date: 2026-10-05   # optional; warning if older than 8 weeks
  run:
    threshold_pace: "4:15"      # [required for run sessions] min/km at threshold (~1 h race pace)
    lthr_bpm: 172               # optional
    max_hr_bpm: 190             # optional
    # threshold_test_date: 2026-10-12   # optional; warning if older than 8 weeks
    recent_race:                # optional; fallback if threshold_pace is absent (Riegel, 60-min pace)
      distance_km: 10
      time: "44:30"             # implies ~4:32 /km: >5% off threshold_pace, so a warning is raised
  zone_models:
    bike_power: coggan_7        # coggan_7 | custom
    run_pace: daniels_5         # daniels_5 | custom
    hr: lthr_5                  # lthr_5 | custom
    # custom:                   # required for each model set to "custom"; keys: bike_power, run_pace, hr
    #   bike_power:
    #     low_zones: 2          # zones counted as low intensity (below LT1)
    #     zones:                # inclusive upper bounds as fractions of the threshold; none for the top zone
    #       - {name: Z1, upper: 0.55}
    #       - {name: Z2, upper: 0.75}
    #       - {name: Z3, upper: 0.90}
    #       - {name: Z4, upper: 1.05}
    #       - {name: Z5}
  target_mode:                  # how targets are expressed in each session
    bike: power                 # power | hr | rpe
    run: pace                   # pace | hr | rpe

current_fitness:                # used to set the starting load safely
  weekly_hours: {bike: 6, run: 2}                     # [required] recent average
  longest_recent_session_min: {bike: 180, run: 75}    # default: 0 / 0
  weeks_of_consistent_training: 8                     # default: 4

availability:                   # habits and constraints (hard limits)
  days_per_week: 5              # [required] total training days
  weekly_hours_budget: 8        # [required] hard cap
  weekdays:                     # [required] per day: max minutes per sport, or "rest" (missing day = rest)
    mon: rest
    tue: {bike: 60, run: 60}
    wed: {bike: 90, run: 45}
    thu: {bike: 60, run: 60}
    fri: rest
    sat: {bike: 240, run: 120}  # long-session day
    sun: {bike: 120, run: 90}
  long_session_day: sat         # default: sat
  indoor_trainer_days: [tue, thu]   # structured intervals on these days when possible
  swap_rules:
    allow_run_instead_of_bike: true
    allow_bike_instead_of_run: true
    max_runs_per_week: 3        # run frequency cap (injury prevention)
    no_hard_run_after_hard_bike: true
  exceptions: []                # dates known in advance (default: none). Bounds are inclusive,
                                # "to" is optional (one day), ranges must not overlap.
  # exceptions:
  #   - {from: 2027-01-04, to: 2027-01-10, mode: off, note: "ski week"}       # no training
  #   - {from: 2027-02-16, mode: limited, minutes: {bike: 45, run: 0}, note: "business trip"}
  #   - {from: 2027-03-02, mode: limited, minutes: {run: 0}, bike_activity: mtb}  # MTB, not the run
  #   - {from: 2027-03-13, mode: limited, minutes: {bike: 300}, note: "free Saturday"}
  # limited: minutes replace the usual ones for the sports listed (0 = not that sport);
  # bike_activity: road | mtb | trainer forces the kind of every bike session in the range.

goals:                          # [required] at least one
  - name: "10k local race"
    date: 2027-03-14
    type: run_10k               # run_5k | run_10k | run_half_marathon | mtb_xc | mtb_marathon | ultra_endurance
    priority: A                 # A drives the macrocycle; B/C get mini-tapers (default: A)
    target: {time: "41:00"}     # optional; used to set race-pace work
  - name: "MTB marathon"
    date: 2027-06-06
    type: mtb_marathon
    priority: A
    target: {duration_h: 4.5, elevation_m: 2500}
    # sport: bike               # only for ultra_endurance (default: preferences.primary_sport)

preferences:
  primary_sport: bike           # drives specificity of the weekly structure (default: bike)
  intensity_ratio: {low: 0.80, high: 0.20}   # by time in zone, both sports combined
  mesocycle_pattern: "3:1"      # "3:1" | "2:1"
  max_hard_sessions_per_week: 2 # 1-3
  limits:                       # safety caps (0.08 = 8%)
    max_weekly_ramp: 0.08             # week-to-week increase of impact-weighted load
    max_run_volume_increase: 0.10     # week-to-week increase of run volume
    max_long_session_increase: 0.10   # week-to-week increase of the long session
    recovery_week_factor: 0.65        # recovery week load vs previous week
    run_impact_multiplier: 1.25       # run TSS weight for ramp/fatigue limits only
    injury_run_impact_bonus: 0.15     # added to the multiplier when injury_notes is non-empty
