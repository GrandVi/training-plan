[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endurance-planner"
version = "0.1.0"
description = "Multi-sport (cycling + running) training plan generator with intervals.icu export"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/endurance_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]
