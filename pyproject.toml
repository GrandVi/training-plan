[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endurance-planner"
version = "0.1.0"
description = "Multi-sport (cycling + running) training plan generator with intervals.icu export"
readme = "README.md"
requires-python = ">=3.11"
# Core: the planning library only. Adapters come as extras (cli, http, api).
dependencies = ["pydantic>=2.6", "PyYAML>=6.0"]

[project.scripts]
endurance-planner = "endurance_planner.launcher:main"

[project.optional-dependencies]
cli = ["typer>=0.12"]
http = ["httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
all = ["endurance-planner[cli,http,api]"]
dev = [
    "endurance-planner[cli,http,api]",
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "jsonschema>=4.18",
    "types-jsonschema",
]

[tool.hatch.build.targets.wheel]
packages = ["src/endurance_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/endurance_planner/templates.py" = ["E501"]  # data file: one-line rationales

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]
