<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0b57d0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Training plan: weeks, sessions and changes">
  <title>Training plan</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-bike" viewBox="0 0 24 24">
      <circle cx="5.5" cy="16.5" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="18.5" cy="16.5" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M5.5 16.5 9.5 8h6l3 8.5M9.5 8 12 16.5h-6.5M14 5h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-run" viewBox="0 0 24 24">
      <circle cx="14" cy="4" r="2.2" fill="currentColor"/>
      <path d="M7 21l3.5-5.5L13 17v4M10.5 15.5 12 9l-3 1.5L7 13M12 9l3 3 3.5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-strength" viewBox="0 0 24 24">
      <path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
  </svg>
  <a class="skip" href="#view">Skip to content</a>
  <header class="top">
    <a class="brand" href="#/">Training plan</a>
    <span id="revision" class="muted small"></span>
  </header>
  <p id="offline" class="banner" hidden>Offline: showing the last plan saved on this device. Changes need a connection.</p>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <main id="view" tabindex="-1">
    <p class="muted">Loading…</p>
    <noscript><p>This app needs JavaScript.</p></noscript>
  </main>
  <nav class="tabs" aria-label="Main">
    <a href="#/" data-tab="week">Week</a>
    <a href="#/review" data-tab="review">Review</a>
    <a href="#/unavailable" data-tab="unavailable">Time off</a>
    <a href="#/push" data-tab="push">Push</a>
    <a href="#/amendments" data-tab="amendments">Changes</a>
    <a href="#/settings" data-tab="settings">Settings</a>
  </nav>
</body>
</html>
